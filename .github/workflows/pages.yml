name: Deploy static site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site-bundle
          path: site-bundle
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site-bundle
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
